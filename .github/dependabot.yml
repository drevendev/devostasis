version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Feature and maintenance PRs target the active release, per CONTRIBUTING.md.
    target-branch: "release/0.3.0"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "release/0.3.0"
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
