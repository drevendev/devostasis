name: Bound Devostasis consumer operations
on:
  workflow_call:
    inputs:
      devostasis-ref:
        type: string
        default: v0.6.0
      binding-path:
        type: string
        default: .devostasis/work-adoption.json
      policy-path:
        type: string
        default: .devostasis/work-policy.json
      history-runner:
        description: Protected Linux runner with Python, Git and a private durable volume
        type: string
        required: true
      history-store:
        type: string
        default: /var/lib/devostasis-work
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
concurrency:
  group: canonical-work-operations-${{ github.repository }}
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ !github.event.pull_request && github.ref_name == github.event.repository.default_branch && github.ref_protected }}
    runs-on: [self-hosted, linux, "${{ inputs.history-runner }}"]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned engine
        env:
          DEVOSTASIS_REF: ${{ inputs.devostasis-ref }}
        run: python -m pip install "git+https://github.com/drevendev/Devostasis.git@${DEVOSTASIS_REF}"
      - name: Verify caller and observe
        env:
          DEVOSTASIS_GITHUB_TOKEN: ${{ github.token }}
          BINDING: ${{ inputs.binding-path }}
          POLICY: ${{ inputs.policy-path }}
          HISTORY_STORE: ${{ inputs.history-store }}
          EXPECTED_PROJECT: ${{ github.repository_id }}
          EXPECTED_ENDPOINT: ${{ github.api_url }}
        run: |
          mkdir -p work-output
          python - <<'PY'
          import json, os
          from devostasis.workscope.operations import binding
          b = binding(json.load(open(os.environ['BINDING'])), json.load(open(os.environ['POLICY'])))
          if b['project']['provider'] != 'github' or b['project']['endpoint'] != os.environ['EXPECTED_ENDPOINT'] or b['project']['project_id'] != os.environ['EXPECTED_PROJECT']:
              raise ValueError('caller project binding mismatch')
          PY
          rc=0
          python -m devostasis work observe --binding "$BINDING" --policy "$POLICY" \
            --store "$HISTORY_STORE" --output work-output/result.json 2> work-output/failure.txt || rc=$?
          python -m devostasis work audit --store "$HISTORY_STORE" --provider github \
            --endpoint "$EXPECTED_ENDPOINT" --expected-project-id "$EXPECTED_PROJECT" --output work-output/audit.json
          python -m devostasis work export-history --store "$HISTORY_STORE" --provider github \
            --endpoint "$EXPECTED_ENDPOINT" --expected-project-id "$EXPECTED_PROJECT" --output work-output/history.zip
          cat work-output/audit.json >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devostasis-operations-${{ github.run_id }}
          path: work-output/
          retention-days: 30
          if-no-files-found: warn
