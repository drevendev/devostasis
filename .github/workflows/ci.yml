name: CI

on:
  push:
    branches: ["master", "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --quiet -e ".[dev]"
      - name: Conformance and unit tests
        run: python -m pytest -q
      - name: Conformance vectors through the command line
        run: devostasis vectors --quiet
      - name: Example bundle verifies from its own contents
        run: devostasis verify --bundle examples/sample-bundle
      - name: Work companion replay and deterministic handoff
        run: |
          devostasis work verify --bundle examples/work/bundle
          devostasis work replay --bundle examples/work/bundle
          devostasis work slice --bundle examples/work/bundle --at 2026-10-02T12:00:00Z --limit 2
          devostasis work build --inventory examples/work/inventory.json --policy examples/work/policy.json --evidence examples/work/evidence.json --store /tmp/work-a > /tmp/work-a.json
          devostasis work build --inventory examples/work/inventory.json --policy examples/work/policy.json --evidence examples/work/evidence.json --store /tmp/work-b > /tmp/work-b.json
          python - <<'PY'
          import json, subprocess
          a = json.load(open('/tmp/work-a.json'))
          b = json.load(open('/tmp/work-b.json'))
          assert a['bundle_id'] == b['bundle_id']
          subprocess.run(['devostasis', 'work', 'verify', '--bundle', a['path']], check=True)
          PY
      - name: Determinism check on the example observations
        run: |
          a=$(devostasis build --observations examples/observations.json --store /tmp/store-a --planning milestones --debt-label type:refactor --debt-mapping-version example-1 | head -n 1 | awk '{print $2}')
          b=$(devostasis build --observations examples/observations.json --store /tmp/store-b --planning milestones --debt-label type:refactor --debt-mapping-version example-1 | head -n 1 | awk '{print $2}')
          echo "bundle ids: $a $b"
          test -n "$a" && test "$a" = "$b"
          devostasis verify --bundle /tmp/store-a/projects/github.com/acme/widget/latest
