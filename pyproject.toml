[build-system]
requires = ["setuptools>=77"]  # PEP 639: license = "<SPDX>" and license-files need 77.0.0
build-backend = "setuptools.build_meta"

[project]
name = "devostasis"
version = "0.4.0"
description = "Deterministic, model-free vital signs for software repositories."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Dreven" }]
keywords = ["repository", "telemetry", "vitals", "github", "deterministic", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devostasis = "devostasis.cli:main"

[project.urls]
Homepage = "https://github.com/drevendev/devostasis"
Issues = "https://github.com/drevendev/devostasis/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
